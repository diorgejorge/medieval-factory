<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medieval Factory</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1a17; }
      #game { position: fixed; inset: 0; }
      #hud {
        position: fixed; top: 8px; left: 8px; padding: 4px 8px;
        font: 12px/1.4 monospace; color: #f2e8cf; background: rgba(0, 0, 0, 0.55);
        border-radius: 4px; pointer-events: none; white-space: pre;
      }
      #panel {
        position: fixed; top: 8px; right: 8px; width: 260px; padding: 10px 14px;
        font: 13px/1.45 Georgia, serif; color: #2b1d12; background: #ead8b1;
        border: 3px solid #5a3a22; border-radius: 6px; box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35);
      }
      #panel h2 { margin: 0 0 6px; font-size: 18px; }
      #panel p { margin: 4px 0; }
      #panel .quote { font-style: italic; color: #5a3a22; }
      #panel button {
        display: block; width: 100%; margin: 3px 0; padding: 3px 6px; text-align: left; cursor: pointer;
        font: 12px Georgia, serif; background: #d9c08c; border: 2px solid #5a3a22; border-radius: 4px;
      }
      #panel button.active { background: #8fbf5a; }
      #panel .warning { color: #b0301e; font-weight: bold; }
      #panel .hint { margin-top: 8px; font: 11px monospace; color: #7a5a3a; }
      /* Cartas (tutorial, decretos e eras): pergaminho com título em tinta vermelha e assinatura. */
      #tutorial {
        position: fixed; left: 12px; bottom: 96px; max-width: 340px; padding: 12px 16px 10px;
        cursor: pointer; font: 13px/1.5 Georgia, serif; color: #2b1d12;
        background: linear-gradient(180deg, #f4e6c4 0%, #ead8b1 55%, #dcc394 100%);
        border: 3px double #7a5230; border-radius: 4px;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35), inset 0 0 18px rgba(122, 82, 48, 0.25);
      }
      #tutorial:hover { filter: brightness(1.04); }
      #tutorial h3, #panel h3 {
        margin: 0 0 6px; padding-bottom: 4px; font: bold 15px Georgia, serif; font-variant: small-caps;
        letter-spacing: 0.04em; color: #7a1f12; border-bottom: 1px solid rgba(122, 82, 48, 0.45);
      }
      #tutorial p { margin: 4px 0; }
      #tutorial .quote, #panel .quote { font-style: italic; color: #4a2e18; }
      #tutorial .quote::first-letter, #panel h3 + .quote::first-letter {
        float: left; margin: 3px 4px 0 0; font: bold 26px/0.9 Georgia, serif; font-style: normal; color: #7a1f12;
      }
      #tutorial .speaker, #panel .speaker {
        margin-top: 6px; text-align: right; font-style: italic; font-size: 12px; color: #5a3a22;
      }
      #tutorial .speaker:not(:empty)::before, #panel .speaker:not(:empty)::before { content: "— "; }
      #toolbar {
        position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); padding: 6px 8px;
        width: max-content; max-width: calc(100vw - 32px);
        font: 13px Georgia, serif; color: #2b1d12; background: #ead8b1; text-align: center;
        border: 3px solid #5a3a22; border-radius: 6px; box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35);
      }
      #toolbar button {
        margin: 2px 3px; padding: 4px 10px; font: inherit; color: inherit; cursor: pointer;
        background: #d9c08c; border: 2px solid #5a3a22; border-radius: 4px;
      }
      #toolbar button.active { background: #8fbf5a; }
      #toolbar button:hover:not(:disabled) { filter: brightness(1.08); }
      #toolbar button:disabled { opacity: 0.45; cursor: not-allowed; }
      /* Bandeja da categoria aberta: fica por cima da fileira de categorias, ligada à aba aberta. */
      #toolbar .options {
        display: flex; flex-wrap: wrap; justify-content: center; gap: 2px;
        margin: 0 0 6px; padding: 4px 6px; background: #d2b783;
        border: 2px solid #5a3a22; border-radius: 5px; box-shadow: inset 0 2px 0 rgba(0, 0, 0, 0.12);
      }
      #toolbar .options[hidden] { display: none; }
      #toolbar .options button { background: #ead8b1; }
      #toolbar .options button.active { background: #8fbf5a; }
      #toolbar .categories { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; }
      #toolbar .category.open {
        color: #f2e8cf; background: #5a3a22; border-color: #2b1d12;
        box-shadow: inset 0 -3px 0 #8fbf5a;
      }
      #toolbar .remove { background: #e0a98c; }
      #toolbar .remove.active { color: #f2e8cf; background: #b0301e; }
      #toolbar .status { margin-top: 4px; font: 11px monospace; color: #5a3a22; }
      #toolbar .status.blocked { color: #b0301e; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="hud"></div>
    <div id="panel" hidden></div>
    <div id="toolbar"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
